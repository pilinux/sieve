name: CLA

on:
  issue_comment:
    types: [created]
  # Runs in the base repository, so it can comment and store signatures on pull requests from forks. It never checks out their code.
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-26.04
    steps:
      - name: CLA Assistant
        if: >-
          github.event_name == 'pull_request_target' ||
          github.event.comment.body == 'recheck' ||
          github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
        # v2.6.1, pinned to its commit. The project is archived, so this release is the last.
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/pilinux/sieve/blob/main/CLA.md
          path-to-signatures: signatures/version1/cla.json
          # A branch of its own, so main can stay protected.
          branch: cla-signatures
          allowlist: pilinux,dependabot[bot],github-actions[bot]
          custom-notsigned-prcomment: >-
            Thank you for your contribution. Before it can be merged, please
            read the [Sieve Contributor License Agreement](https://github.com/pilinux/sieve/blob/main/CLA.md)
            and sign it by posting the comment below. One signature covers
            all your future pull requests.
          signed-commit-message: "chore: $contributorName signed the CLA in #$pullRequestNo"
          create-file-commit-message: "chore: add CLA signatures file"
